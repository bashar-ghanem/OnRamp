name: Push to Main # The display name of the workflow in the GitHub Actions tab

on: # defines the trigger for the workflow
  push: # trigger this workflow on push events
    branches: # specify which branches to trigger on
      - main # trigger on pushes to the main branch

jobs:
  build: # the name of the job
    runs-on: ubuntu-latest # run this job on the latest version of Ubuntu
    steps: # a job is made of steps executed in order
      - name: log merge message # label for the step
        run: echo "Code is merged to main branch!" # the command to run, which simply prints a message to the console